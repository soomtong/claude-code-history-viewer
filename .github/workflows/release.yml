# v* 태그 push 또는 수동 실행 시 scripts/release.sh --publish 실행 (docs/decisions/0009-release.md)
# 수동 실행은 main 에서 돌리면 gh release create 가 main HEAD 에 v<VERSION> 태그를 만든다.
# 필요한 시크릿: HOMEBREW_TAP_TOKEN (soomtong/homebrew-tap 에 contents 쓰기 권한)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  LISETTE_VERSION: 0.12.5
  # lisette-x86_64-unknown-linux-musl.tar.xz 의 sha256 (버전을 올리면 함께 갱신)
  LISETTE_SHA256: 3926cbf7825b3f9ef8e7c6c4b1d06082ccba4adf86e44e9bd68242722254e2de

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install lis (prebuilt)
        run: |
          name=lisette-x86_64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/ivov/lisette/releases/download/lisette-v$LISETTE_VERSION/$name.tar.xz"
          echo "$LISETTE_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - run: lis --version

      - name: Check tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^const VERSION = "\(.*\)"$/\1/p' src/main.lis)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || {
            echo "태그 $GITHUB_REF_NAME 와 src/main.lis VERSION $version 이 다름" >&2
            exit 1
          }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAP: https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/soomtong/homebrew-tap.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh --publish
